<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教务制度考试搜题器</title>
<meta name="theme-color" content="#2f9e5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="教务搜题">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg">
<style>
/* ============ 设计token：清爽淡绿 ============ */
:root{
  --bg:#eef7ee;
  --bg-2:#e2f1e2;
  --card:#ffffff;
  --ink:#26352b;
  --ink-soft:#5c7163;
  --line:#d8e8d8;
  --brand:#2f9e5f;
  --brand-strong:#25894f;
  --brand-soft:#e0f2e4;
  --brand-soft-2:#c9ebd2;
  --accent:#eaf7ec;
  --danger:#b4483e;
  --shadow:0 6px 20px rgba(47,158,95,.10);
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 85% -10%, var(--brand-soft-2) 0%, transparent 60%),
    radial-gradient(900px 400px at -10% 110%, var(--brand-soft) 0%, transparent 55%),
    var(--bg);
  min-height:100%;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px}

/* ============ 顶栏 ============ */
header.app-head{
  display:flex;align-items:center;gap:12px;
  padding:6px 2px 18px;
}
.brand-mark{
  width:42px;height:42px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,var(--brand),var(--brand-strong));
  display:grid;place-items:center;box-shadow:var(--shadow);
}
.brand-mark svg{width:24px;height:24px}
.head-txt h1{font-size:20px;font-weight:700;letter-spacing:.2px}
.head-txt p{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.head-badge{margin-left:auto;font-size:12px;color:var(--brand-strong);
  background:var(--brand-soft);border:1px solid var(--brand-soft-2);
  padding:4px 12px;border-radius:999px;white-space:nowrap}

/* ============ 卡片 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ============ 搜索区 ============ */
.search-box{padding:18px 18px 16px}
.search-bar{
  display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--line);border-radius:12px;
  background:#fbfefb;padding:6px 8px 6px 14px;
  transition:border-color .18s, box-shadow .18s;
}
.search-bar:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,158,95,.14)}
.search-bar svg{width:20px;height:20px;flex:none;color:var(--brand)}
.search-bar input{
  flex:1;border:none;outline:none;background:transparent;
  font-size:16px;color:var(--ink);min-width:0;
}
.search-bar input::placeholder{color:#9bb0a1}
.search-btn{
  flex:none;border:none;cursor:pointer;border-radius:9px;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;
  padding:10px 18px;transition:background .15s;
}
.search-btn:hover{background:var(--brand-strong)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.f-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:#fbfefb;color:var(--ink-soft);
  font-size:13px;padding:5px 13px;border-radius:999px;cursor:pointer;
  transition:all .14s;user-select:none;
}
.chip.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong);font-weight:600}
.f-count{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
.f-count b{color:var(--brand-strong);font-size:15px}

/* ============ 结果 ============ */
.results{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.q-card{padding:16px 18px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.q-head{display:flex;align-items:flex-start;gap:10px}
.q-type{
  flex:none;font-size:12px;font-weight:700;color:#fff;
  padding:3px 10px;border-radius:6px;margin-top:1px;
}
.t-single{background:#4f9fc0}
.t-multi{background:#b07cc4}
.t-judge{background:#e09a4a}
.q-text{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.65}
.q-opts{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:9px;
  font-size:14.5px;color:#35473c;line-height:1.55;
  padding:7px 10px;border-radius:9px;background:#fafcfa;border:1px solid transparent;
}
.opt .key{
  flex:none;width:22px;height:22px;border-radius:6px;margin-top:1px;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:#eef4ee;color:var(--ink-soft);
}
.opt.correct{background:var(--brand-soft);border-color:var(--brand-soft-2)}
.opt.correct .key{background:var(--brand);color:#fff}
.q-answer{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);
  display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft)}
.q-answer .lab{font-weight:600;color:var(--brand-strong)}
.q-answer .val{font-weight:700;color:var(--brand-strong);font-size:15px}
.q-meta{margin-left:auto;font-size:12px;color:#9bb0a1}

/* ============ 空态 ============ */
.empty{
  text-align:center;padding:46px 20px;color:var(--ink-soft);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
}
.empty svg{width:40px;height:40px;color:var(--brand-soft-2);margin-bottom:8px}
.empty .t{font-size:15px;font-weight:600;color:var(--ink)}
.empty .s{font-size:13px;margin-top:4px;color:var(--ink-soft)}

/* ============ 拍照搜题 ============ */
.camera-card{margin-top:16px;padding:18px}
.camera-card h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.camera-card .hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.upload-area{
  border:1.5px dashed var(--brand-soft-2);border-radius:12px;background:var(--accent);
  padding:22px 14px;text-align:center;cursor:pointer;transition:background .15s;
}
.upload-area:hover{background:var(--brand-soft)}
.upload-area svg{width:30px;height:30px;color:var(--brand);margin-bottom:6px}
.upload-area .main{font-size:14px;font-weight:600;color:var(--brand-strong)}
.upload-area .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.preview-wrap{position:relative;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.preview-wrap img{display:block;width:100%;max-height:320px;object-fit:contain;background:#f4f8f4}
.ocr-status{margin-top:12px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--brand-soft-2);
  border-top-color:var(--brand);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-text{margin-top:10px;font-size:13px;color:var(--ink-soft);background:#f4f8f4;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.7}
.ocr-text b{color:var(--ink)}

/* ============ 页脚提示 ============ */
.note{margin-top:18px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.7}
.note a{color:var(--brand-strong)}

@media (max-width:520px){
  .wrap{padding:16px 12px 50px}
  .head-txt h1{font-size:18px}
  .search-btn{padding:10px 14px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M7 9h10M7 13h7M7 17h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="head-txt">
      <h1>教务制度考试搜题器</h1>
      <p>学籍管理实施细则 · 题库查题</p>
    </div>
    <span class="head-badge" id="qcount">加载中…</span>
  </header>

  <!-- ===== 视图：搜题 ===== -->
  <section class="card search-box" id="searchView">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="kw" placeholder="输入关键词或题干，如：学分 / 退课 / 教材退订" autocomplete="off">
      <button class="search-btn" id="doSearch">搜 题</button>
    </div>
    <div class="filters">
      <div class="f-chips" id="typeChips">
        <span class="chip active" data-type="all">全部</span>
        <span class="chip" data-type="单选题">单选</span>
        <span class="chip" data-type="多选题">多选</span>
        <span class="chip" data-type="判断题">判断</span>
      </div>
      <span class="f-count">命中 <b id="hitCount">0</b> 题</span>
    </div>
  </section>

  <!-- ===== 视图：拍照搜题 ===== -->
  <section class="card camera-card" id="cameraView">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h4l2-3h4l2 3h4a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z" stroke="var(--brand)" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" stroke="var(--brand)" stroke-width="1.7"/></svg>
      拍照搜题
    </h2>
    <p class="hint">上传考试题目截图，自动识别题干并检索答案。图片仅在本机识别，不会上传网络。</p>
    <div class="upload-area" id="uploadArea">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7 9m5-5l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="main">点击选择或拖入题目截图</div>
      <div class="sub">支持 JPG / PNG，首次使用需加载中文识别模型</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <div class="preview-wrap" id="previewWrap" style="display:none">
      <img id="previewImg" alt="预览">
    </div>
    <div class="ocr-status" id="ocrStatus" style="display:none">
      <span class="spinner" id="ocrSpin"></span><span id="ocrMsg">正在识别题目…</span>
    </div>
    <div class="ocr-text" id="ocrText" style="display:none"></div>
  </section>

  <!-- ===== 结果列表 ===== -->
  <div class="results" id="results"></div>

  <p class="note">题库共 <b id="totalNote">69</b> 道（单选 / 多选 / 判断），资料仅供个人学习复习使用，请勿用于违规用途。</p>
</div>

<script>
/* ============ 全局状态 ============ */
let currentType = 'all';
let lastKeyword = '';
let lastData = [];        // 当前筛选后结果
const $ = id => document.getElementById(id);

/* ============ 题型映射 ============ */
const TYPE_SHORT = {'单选题':'单选','多选题':'多选','判断题':'判断'};
const TYPE_CLASS = {'单选题':'t-single','多选题':'t-multi','判断题':'t-judge'};

/* ============ 归一化文本（用于匹配） ============ */
function norm(s){
  return String(s).toLowerCase()
    .replace(/[\s\u00a0\u3000，,。；;、．·【】\[\]:："'“”‘’\-—()（）/\\]/g,'')
    .trim();
}
function stripFullQ(s){
  return String(s).replace(/[\s\u00a0\u3000]/g,'').trim();
}

/* ============ 搜索 ============ */
function doSearch(){
  lastKeyword = $('kw').value.trim();
  const nk = norm(lastKeyword);
  let base = QBANK;
  if(currentType !== 'all') base = base.filter(q => q.t === currentType);
  if(nk){
    const segs = nk.split(/[\s]+/).filter(Boolean);
    base = base.filter(q => {
      const text = norm(q.q + ' ' + Object.values(q.o).join(' ') + ' ' + q.k);
      return segs.every(s => text.includes(s));
    });
  } else {
    // 空关键词：默认展示当前题型全部
    lastData = base;
    renderResults(base);
    return;
  }
  lastData = base;
  renderResults(base);
}

/* ============ 渲染结果 ============ */
function renderResults(list){
  $('hitCount').textContent = list.length;
  const box = $('results');
  if(!list.length){
    box.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div class="t">未找到匹配题目</div>
      <div class="s">换个关键词，或缩小题型范围再试</div>
    </div>`;
    return;
  }
  let html = '';
  for(const q of list){
    const okeys = Object.keys(q.o);
    html += `<article class="q-card">
      <div class="q-head">
        <span class="q-type ${TYPE_CLASS[q.t]}">${TYPE_SHORT[q.t]}</span>
        <div class="q-text">${esc(q.q)}</div>
      </div>`;
    if(okeys.length){
      html += '<div class="q-opts">';
      const ans = String(q.a).split('').filter(ch => ch && ch.trim());
      for(const k of okeys){
        const isCorrect = ans.includes(k);
        html += `<div class="opt${isCorrect?' correct':''}">
          <span class="key">${k}</span><span>${esc(q.o[k])}</span>
        </div>`;
      }
      html += '</div>';
    }
    html += `<div class="q-answer"><span class="lab">正确答案</span><span class="val">${esc(q.a)}</span>`;
    if(q.k) html += `<span class="q-meta">知识点：${esc(q.k)}</span>`;
    html += '</div></article>';
  }
  box.innerHTML = html;
}

/* ============ HTML 转义 ============ */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============ 事件绑定 ============ */
$('doSearch').addEventListener('click', doSearch);
$('kw').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
$('typeChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentType = chip.dataset.type;
  doSearch();
});

/* ============ 拍照搜题 OCR ============ */
let worker = null;
let workerLoading = null;
const UPLOAD = $('uploadArea');
const FILE_IN = $('fileInput');
UPLOAD.addEventListener('click', () => FILE_IN.click());
FILE_IN.addEventListener('change', e => {
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});
['dragover','drop'].forEach(ev => UPLOAD.addEventListener(ev, e => {
  e.preventDefault();
  if(ev==='drop' && e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
}));

async function handleFile(file){
  if(!/image\/(jpeg|png|webp)/.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)){
    alert('请上传 JPG / PNG 格式的图片');
    return;
  }
  const url = URL.createObjectURL(file);
  $('previewImg').src = url;
  $('previewWrap').style.display = 'block';
  try{
    const text = await recognize(url);
    $('ocrText').style.display = 'block';
    $('ocrText').innerHTML = `<b>识别内容：</b>${esc(text.slice(0,400))}`;
    if(text){
      // 提取题目相关文本用于检索：取前若干含最多有效字的片段
      $('kw').value = cleanQuestion(text);
      doSearch();
      $('ocrText').scrollIntoView({behavior:'smooth', block:'nearest'});
    }
  }catch(err){
    $('ocrMsg').textContent = '识别失败：' + err.message;
  }
  URL.revokeObjectURL(url);
}

function cleanQuestion(text){
  // 去掉 OCR 常见干扰（序号、选项标签、我的答案等），提取题干
  const t = String(text);
  const clean = t
    .replace(/\b[A-D][.．、:：]?/g,' ')
    .replace(/[（(]\s*[A-D]\s*[)）]/g,' ')
    .replace(/我的答案[:：]?\s*/g,' ')
    .replace(/正确答案[:：]?\s*/g,' ')
    .replace(/[0-9]+\.?\s*[分分]/g,' ');
  const lines = clean.split(/[\n\r]+/).map(s=>s.trim()).filter(s=>s.length>=6);
  // 取第一个长度最长的行作为题干关键词（截断到可检索长度）
  let best = '';
  for(const l of lines){ if(l.length>best.length) best = l; }
  if(!best) best = clean.replace(/[\n\r]+/g,' ');
  return best.replace(/\s+/g,' ').slice(0,60);
}

/* ============ Tesseract OCR（离线，中文） ============ */
async function recognize(imageUrl){
  $('ocrStatus').style.display = 'flex';
  try{
    if(!worker){
      $('ocrMsg').textContent = '正在加载中文识别模型（首次约需数秒~数十秒）…';
      workerLoading = Tesseract.createWorker('chi_sim', 1, {
        logger: m => { if(m.status==='recognizing text') $('ocrMsg').textContent = '识别中… '; }
      });
      worker = await workerLoading;
    }
    $('ocrMsg').textContent = '正在识别题目…';
    const { data } = await worker.recognize(imageUrl);
    const text = (data && data.text) || '';
    if(!text.trim()) throw new Error('未识别到文字，请尝试更清晰的图片');
    return text.trim();
  } finally {
    $('ocrStatus').style.display = 'none';
  }
}

/* ============ 初始化 ============ */
$('qcount').textContent = QBANK.length + ' 题';
$('totalNote').textContent = QBANK.length;
doSearch();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => {})
      .catch(() => {});
  });
}
